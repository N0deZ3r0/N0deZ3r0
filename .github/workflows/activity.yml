name: Activity

# Draws the Activity cards from this account's own data and commits them to
# `assets/` on main, which is where the README points. Nothing is fetched from
# anyone else's server while the profile is being read.
#
# The cards this replaces came from a free shared service. When its API budget
# ran out it answered with a picture reading ERROR, sent as HTTP 200 -- which
# GitHub's image proxy caches like any other image, so the word ERROR could
# outlive the outage that caused it. Drawing them here removes the dependency
# rather than papering over it.
#
# Committing to the branch the job is triggered by does not start the job
# again: a push made with the default job token raises no workflow events.

on:
  schedule:
    # Daily, at an off-peak minute so the run is not queued behind the crowd.
    - cron: '23 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with Pacman on purpose: both commit to main, and two jobs pushing
  # at once is a race one of them loses.
  group: publish
  cancel-in-progress: false

jobs:
  render:
    name: Draw and publish
    runs-on: ubuntu-latest

    steps:
      # Pinned to the commit behind v7.0.1 rather than a moving tag: a tag can
      # be repointed at new code, and this job runs with write access.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Draw the cards
        env:
          # The default job token sees the public calendar only, which is also
          # what a visitor to the profile sees, so the cards and the page agree.
          # A personal token with `read:user` in ACTIVITY_TOKEN widens the
          # counts to include private work -- the same switch pacman.yml has,
          # and it has to be thrown in both places or the numbers and the
          # picture would be describing different years.
          GITHUB_TOKEN: ${{ secrets.ACTIVITY_TOKEN || github.token }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          OUTPUT_DIR: assets
          UTC_OFFSET: '3'
        run: python3 .github/scripts/render_activity.py

      - name: Commit the cards
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/overview-*.svg assets/insight-*.svg assets/streak-*.svg
          if git diff --cached --quiet; then
            echo 'The numbers have not moved.'
            exit 0
          fi
          git commit --quiet -m 'Redraw the activity cards'
          for attempt in 1 2 3; do
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            git pull --rebase --quiet origin main
          done
          exit 1
