name: Pacman

# Redraws the contribution graph as a game of Pac-Man and publishes the two
# SVGs to the `output` branch, which is where the snake used to be published
# from. The README points at that branch, so the picture stays current without
# anything being fetched from a third party while the profile is read.
#
# There are ready-made actions for this. Writing it here keeps the profile to
# one rule -- the picture on it is generated by code in this repository -- and
# means an SVG served under this account was not built by a release nobody
# here has read.
#
# This job and Activity own one branch each. They would otherwise force-push
# over each other, since each replaces its branch wholesale.

on:
  schedule:
    # Daily, at an off-peak minute so the run is not queued behind the crowd.
    - cron: '17 3 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pacman
  cancel-in-progress: true

jobs:
  generate:
    name: Draw and publish
    runs-on: ubuntu-latest

    steps:
      # Pinned to the commit behind v7.0.1 rather than a moving tag: a tag can
      # be repointed at new code, and this job runs with write access.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Draw the board
        env:
          # The default job token sees the public calendar only, so days spent
          # in private repositories come back empty. A personal token with the
          # `read:user` scope in ACTIVITY_TOKEN fills them in -- the same secret
          # the Activity cards read, so the board and the numbers beside it
          # always describe the same year.
          GITHUB_TOKEN: ${{ secrets.ACTIVITY_TOKEN || github.token }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          OUTPUT_DIR: dist
        run: python3 .github/scripts/render_pacman.py

      - name: Publish to the output branch
        run: |
          set -euo pipefail
          cd dist
          git init --quiet --initial-branch=output
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pacman-dark.svg pacman-light.svg
          git commit --quiet -m 'Redraw the contribution board'
          # The branch holds nothing but these generated files, so replacing its
          # history each run is intended.
          git push --force --quiet \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            output
