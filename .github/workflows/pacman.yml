name: Pacman

# Replays the contribution calendar as a game of Pac-Man and commits the two
# SVGs to `assets/` on main, which is where the README points.
#
# They used to live on a branch of their own, to keep generated files out of
# the history. One branch is simpler to hold in your head, and the cost is
# visible: main collects a commit from this job whenever the board is redrawn.
#
# Committing to the branch the job is triggered by does not start the job
# again. A push made with the default job token raises no workflow events at
# all -- that is the rule this relies on, and without it the two of them would
# chase each other forever.
#
# There are ready-made actions for this. Writing it here keeps the profile to
# one rule -- the picture on it is generated by code in this repository -- and
# means an SVG served under this account was not built by a release nobody
# here has read.

on:
  schedule:
    # Daily, at an off-peak minute so the run is not queued behind the crowd.
    - cron: '17 3 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with Activity on purpose: both commit to main now, and two jobs
  # pushing at once is a race one of them loses.
  group: publish
  cancel-in-progress: false

jobs:
  generate:
    name: Draw and publish
    runs-on: ubuntu-latest

    steps:
      # Pinned to the commit behind v7.0.1 rather than a moving tag: a tag can
      # be repointed at new code, and this job runs with write access.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Draw the board
        env:
          # The default job token sees the public calendar only, so days spent
          # in private repositories come back empty. A personal token with the
          # `read:user` scope in ACTIVITY_TOKEN fills them in -- the same secret
          # the Activity cards read, so the board and the numbers beside it
          # always describe the same year.
          GITHUB_TOKEN: ${{ secrets.ACTIVITY_TOKEN || github.token }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          OUTPUT_DIR: assets
        run: python3 .github/scripts/render_pacman.py

      - name: Commit the board
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pacman-dark.svg assets/pacman-light.svg
          if git diff --cached --quiet; then
            echo 'The board came out identical; nothing to commit.'
            exit 0
          fi
          git commit --quiet -m 'Redraw the contribution board'
          # The concurrency group above should keep these apart, but a rebase
          # costs nothing and a lost run costs a day of the board being stale.
          for attempt in 1 2 3; do
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            git pull --rebase --quiet origin main
          done
          exit 1
