name: Snake

# Redraws the contribution graph as a snake eating the commits, and publishes
# the two SVGs to the `output` branch. The README points at that branch, so the
# picture stays current without depending on a third-party image service.

on:
  schedule:
    # Daily, at an off-peak minute so the run is not queued behind the crowd.
    - cron: '17 3 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and publish
    runs-on: ubuntu-latest

    steps:
      # Pinned to the commit behind v3.5.0 rather than a moving tag: a tag can
      # be repointed at new code, and this step runs with write access.
      - name: Draw the snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          # The default job token sees the public calendar only, so days
          # spent in private repositories come back empty. A personal token
          # with the `read:user` scope, stored as SNAKE_TOKEN, returns the
          # whole year; without the secret this falls back to the default.
          github_token: ${{ secrets.SNAKE_TOKEN || github.token }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - name: Publish to the output branch
        run: |
          set -euo pipefail
          cd dist
          git init --quiet --initial-branch=output
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snake-dark.svg snake-light.svg
          git commit --quiet -m "Regenerate the contribution snake"
          # The branch holds nothing but these generated files, so replacing its
          # history each run is intended.
          git push --force --quiet \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            output
