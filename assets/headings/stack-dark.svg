<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="38" role="img" aria-label="Stack">
  <!-- No viewBox on purpose: drawn at 1:1, so the text keeps its size on a
       phone and the rule stretches to whatever width the README has. -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>
  </defs>

  <text x="0" y="24"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="20" font-weight="700" letter-spacing="0.5" fill="#e6edf3">Stack</text>

  <rect x="0" y="37" width="100%" height="1" fill="#21262d"/>
  <rect x="0" y="35" width="40" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
